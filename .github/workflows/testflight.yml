name: Upload Spellful to TestFlight
on:
  push:
    branches: [release/spellful-8]
    paths: ['.github/workflows/testflight.yml']
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused App Store Connect build number for version 1.0
        required: true
        type: string
permissions:
  contents: read
concurrency: spellful-testflight
jobs:
  upload:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/spellful-8')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release/spellful-8' &&
        contains(github.event.head_commit.message, '[testflight]'))
    environment: testflight
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check distribution signing inputs
        env:
          DIST_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          DIST_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          : "${DIST_P12:?Set IOS_DISTRIBUTION_P12_BASE64}"
          : "${DIST_PASSWORD:?Set IOS_DISTRIBUTION_P12_PASSWORD}"
          : "${DIST_PROFILE:?Set IOS_APP_STORE_PROFILE_BASE64}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cap:sync:ios
        env:
          VITE_IOS_API_ORIGIN: ${{ vars.VITE_IOS_API_ORIGIN }}
      - name: Sign archive and upload to App Store Connect
        env:
          BUILD_NUMBER: ${{ inputs.build_number || '3' }}
          ASC_TEAM: ${{ secrets.ASC_TEAM_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_PRIVATE_KEY }}
          DIST_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          DIST_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          : "${ASC_TEAM:?Set ASC_TEAM_ID}" "${ASC_KEY:?Set ASC_KEY_ID}" "${ASC_ISSUER:?Set ASC_ISSUER_ID}" "${ASC_P8:?Set ASC_PRIVATE_KEY}"
          umask 077
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY.p8"
          keychain="$RUNNER_TEMP/spellful-distribution.keychain-db"
          signing_dir=$(mktemp -d "$RUNNER_TEMP/spellful-signing.XXXXXX")
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$key"; rm -rf "$signing_dir"' EXIT
          printf '%s' "$DIST_P12" | base64 -D > "$signing_dir/distribution.p12"
          printf '%s' "$DIST_PROFILE" | base64 -D > "$signing_dir/distribution.mobileprovision"
          unset DIST_P12 DIST_PROFILE
          security cms -D -i "$signing_dir/distribution.mobileprovision" -o "$signing_dir/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$signing_dir/profile.plist")
          python3 - "$signing_dir/profile.plist" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], "rb") as source:
              profile = plistlib.load(source)
          entitlements = profile["Entitlements"]
          if (os.environ["ASC_TEAM"] not in profile["TeamIdentifier"]
              or entitlements.get("application-identifier") != os.environ["ASC_TEAM"] + ".com.spellful.app"
              or entitlements.get("get-task-allow")
              or "ProvisionedDevices" in profile
              or profile.get("ProvisionsAllDevices")):
              raise SystemExit("Use an App Store Connect profile for com.spellful.app and the configured team.")
          PY
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$signing_dir/distribution.mobileprovision" "$profile_dir/$profile_uuid.mobileprovision"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -k "$keychain" -P "$DIST_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          unset DIST_PASSWORD
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          export PROFILE_UUID="$profile_uuid"
          python3 - "$key" <<'PY'
          import os, sys
          from pathlib import Path
          pem = os.environ["ASC_P8"].strip().strip("\"'").replace("\\r\\n", "\n").replace("\\n", "\n")
          pem = pem.replace("\r\n", "\n").strip()
          if not pem.startswith("-----BEGIN PRIVATE KEY-----\n") or not pem.endswith("\n-----END PRIVATE KEY-----"):
              raise SystemExit("ASC_PRIVATE_KEY must contain the complete Apple AuthKey .p8 file.")
          Path(sys.argv[1]).write_text(pem + "\n", encoding="ascii")
          PY
          if ! openssl pkey -in "$key" -noout >/dev/null 2>&1; then
            echo "::error::ASC_PRIVATE_KEY is not a readable Apple .p8 private key."
            exit 1
          fi
          unset ASC_P8
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY" -authenticationKeyIssuerID "$ASC_ISSUER")
          archive="$RUNNER_TEMP/Spellful.xcarchive"
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" DEVELOPMENT_TEAM="$ASC_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          app="$archive/Products/Applications/App.app"
          /usr/bin/codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
          python3 - <<'PY'
          import os, plistlib
          for destination in ('export', 'upload'):
              with open(os.path.join(os.environ['RUNNER_TEMP'], destination + '.plist'), 'wb') as f:
                  plistlib.dump(dict(method='app-store-connect',destination=destination,teamID=os.environ['ASC_TEAM'],signingStyle='manual',signingCertificate='Apple Distribution',provisioningProfiles={'com.spellful.app':os.environ['PROFILE_UUID']},manageAppVersionAndBuildNumber=False),f)
          PY
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" "${auth[@]}"
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/upload.plist" -exportPath "$RUNNER_TEMP/upload" "${auth[@]}"
