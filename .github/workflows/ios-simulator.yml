name: iOS simulator
on:
  push:
    branches: [main]
    paths: ['src/**', 'ios/**', 'package*.json', 'capacitor.config.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cap:sync:ios
      - name: Build, install and launch Spellful
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "id=$device" -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$device" com.spellful.app
