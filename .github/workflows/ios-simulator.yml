name: iOS simulator
on:
  push:
    branches: [main]
    paths: ['src/**', 'ios/**', 'package*.json', 'capacitor.config.json', 'qa/ios/**', '.github/workflows/ios-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cap:sync:ios
      - name: Build, install and launch Spellful
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "id=$device" -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$device" com.spellful.app
      - name: Package simulator app
        run: ditto -c -k --keepParent build/ios/Build/Products/Release-iphonesimulator/App.app "$RUNNER_TEMP/Spellful-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Spellful-iPhone-simulator
          path: ${{ runner.temp }}/Spellful-simulator.zip
          retention-days: 14
      - name: Exercise signed-in messaging in the native WebView
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ios-live-qa]')
        env:
          SPELLFUL_QA_FIXTURES: ${{ runner.temp }}/spellful-qa-accounts.json
        run: |
          set -euo pipefail
          trap 'rm -f "$SPELLFUL_QA_FIXTURES" ios/App/SpellfulIntegration/accounts.json' EXIT
          python3 qa/ios/provision.py
          ruby qa/ios/add-test-target.rb
          device=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpellfulIntegration -destination "id=$device" -parallel-testing-enabled NO -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
