name: iOS simulator
on:
  push:
    branches: [main]
    paths: ['src/**', 'ios/**', 'package*.json', 'capacitor.config.json', 'qa/ios/**', '.github/workflows/ios-simulator.yml']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['src/**', 'ios/**', 'package*.json', 'capacitor.config.json', 'qa/ios/**', '.github/workflows/ios-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    if: github.event.action != 'labeled' || (github.event.label.name == 'ios-live-qa' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run cap:sync:ios
      - name: Build, install and launch Spellful
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "id=$device" -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$device" com.spellful.app
      - name: Package simulator app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent build/ios/Build/Products/Release-iphonesimulator/App.app "$RUNNER_TEMP/Spellful-simulator.zip"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Spellful-iPhone-simulator
          path: ${{ runner.temp }}/Spellful-simulator.zip
          retention-days: 14
      - name: Provision accounts for explicitly requested live checks
        id: provision
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[ios-live-qa]')) || (github.event.action == 'labeled' && github.event.label.name == 'ios-live-qa')
        env:
          SPELLFUL_QA_FIXTURES: ${{ runner.temp }}/spellful-qa-accounts.json
        run: python3 qa/ios/provision.py
      - name: Test purchases and restoration with Xcode StoreKit
        if: success() || (failure() && steps.provision.outcome == 'failure')
        env:
          SPELLFUL_QA_FIXTURES: ${{ runner.temp }}/spellful-qa-accounts.json
        run: |
          set -euo pipefail
          trap 'rm -f "$SPELLFUL_QA_FIXTURES" ios/App/SpellfulIntegration/accounts.json' EXIT
          ruby -e "require 'xcodeproj'" || gem install --user-install xcodeproj -v 1.27.0 --no-document
          ruby qa/ios/add-test-target.rb
          device=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          flags=(-parallel-testing-enabled NO)
          if [[ ! -f "$SPELLFUL_QA_FIXTURES" ]]; then flags+=('-skip-testing:SpellfulIntegration/SpellfulIntegration/testAuthenticatedMessaging'); fi
          xcodebuild test -project ios/App/App.xcodeproj -scheme SpellfulIntegration -destination "id=$device" -derivedDataPath build/ios "${flags[@]}" CODE_SIGNING_ALLOWED=NO
